---
- name: Update installed packages
  ansible.builtin.dnf:
    name: "*"
    state: latest

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - docker
      - awscli
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Create ATLAS application directory
  ansible.builtin.file:
    path: /opt/atlas
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create ATLAS deployment user
  ansible.builtin.user:
    name: atlas
    system: true
    shell: /bin/bash
    create_home: true

- name: Create ATLAS config directory
  ansible.builtin.file:
    path: /opt/atlas/config
    state: directory
    owner: atlas
    group: atlas
    mode: "0755"

- name: Create ATLAS logs directory
  ansible.builtin.file:
    path: /opt/atlas/logs
    state: directory
    owner: atlas
    group: atlas
    mode: "0755"

- name: Add atlas user to docker group
  ansible.builtin.user:
    name: atlas
    groups: docker
    append: true

- name: Display server configuration completion
  ansible.builtin.debug:
    msg: "ATLAS server configuration completed successfully"

- name: Authenticate Docker with ECR
  ansible.builtin.shell: |
    aws ecr get-login-password --region {{ atlas_aws_region }} | \
    docker login --username AWS --password-stdin {{ atlas_ecr_registry }}
  environment:
    AWS_DEFAULT_REGION: "{{ atlas_aws_region }}"
  no_log: true
  changed_when: true

- name: Pull ATLAS image from ECR
  ansible.builtin.command:
    cmd: docker pull {{ atlas_image }}
  register: atlas_docker_pull
  changed_when: true

- name: Stop existing ATLAS container
  ansible.builtin.command:
    cmd: docker stop {{ atlas_container_name }}
  failed_when: false
  changed_when: false

- name: Remove existing ATLAS container
  ansible.builtin.command:
    cmd: docker rm {{ atlas_container_name }}
  failed_when: false
  changed_when: false

- name: Create ATLAS systemd service
  ansible.builtin.template:
    src: atlas.service.j2
    dest: /etc/systemd/system/atlas.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ATLAS service

- name: Enable and start ATLAS service
  ansible.builtin.systemd:
    name: atlas
    enabled: true
    state: started
    daemon_reload: true
